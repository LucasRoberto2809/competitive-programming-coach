[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "competitive-programming-skills-hooks"
version = "0.1.0"
description = "Hooks used by the competitive-programming skills"
requires-python = ">=3.10"
dependencies = [
    "github-copilot-sdk>=0.1.25",
    "ollama>=0.4.7",
]

[tool.setuptools.packages.find]
include = ["hooks*"]
