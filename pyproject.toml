[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "competitive-programming-framework"
version = "0.1.0"
description = "Separated Python services for competitive-programming learning and Problem Setter workflows"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.4.7",
]

[tool.setuptools.packages.find]
include = ["cp_framework*"]
